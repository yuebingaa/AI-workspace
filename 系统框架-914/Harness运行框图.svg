</style><rect width="2000" height="1440" fill="#f8f7f4"/>
<text x="48" y="60" class="title">AgentCanvas · Harness 运行框架</text>
<text x="48" y="98" class="subtitle">2026-09-14 工作区实现快照  /  核心执行、依赖边界与交付控制</text>
<rect x="430" y="140" width="1150" height="1040" rx="20" fill="#efefea" stroke="#bec5be" stroke-width="1.5"/>
<text x="458" y="178" class="section">HarnessRuntime · 唯一核心执行器</text>
<text x="458" y="207" class="small">模型提出动作，执行器维护状态、限制与验收；旧 DeepSeekHarness 仅作服务端兼容组装</text>
