<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1440" viewBox="0 0 2000 1440" role="img" aria-labelledby="title desc">
<title id="title">AgentCanvas Harness 运行框架 · 2026-09-14</title>
<desc id="desc">请求经服务端授权与依赖组装进入通用 HarnessRuntime。核心循环为规划、上下文、模型动作、工具门控、工具执行与观察；候选经过证据验证，失败有有限恢复和自然语言解释，最终输出一份任务回执。模型适配、预算、证据和持久化位于各自边界。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#707875"/></marker></defs>
